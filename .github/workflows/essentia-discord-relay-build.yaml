name: essentia-discord-relay build

on:
  push:
    branches: [main]
    paths:
      - k8s/essentia/discord-relay/Dockerfile
      - k8s/essentia/discord-relay/relay.mjs
      - .github/workflows/essentia-discord-relay-build.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/manamana32321/essentia-discord-relay
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: k8s/essentia/discord-relay
          # 클러스터에 amd64(json-server-1/2)와 arm64(raspi-1)가 섞여 있다.
          # 단일 아키텍처로 빌드하면 반대편 노드에 스케줄될 때
          # "no match for platform in manifest" 로 ImagePullBackOff 가 난다.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
