apiVersion: v1
kind: Service
metadata:
  name: alloy-gateway-syslog-lan
  namespace: observability
spec:
  type: LoadBalancer
  ports:
    - name: syslog
      port: 5514
      targetPort: 5514
      protocol: UDP
    - name: syslog-coral
      port: 5515
      targetPort: 5515
      protocol: UDP
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-gateway
