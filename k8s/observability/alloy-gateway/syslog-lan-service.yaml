apiVersion: v1
kind: Service
metadata:
  annotations:
    ignore-check.kube-linter.io/dangling-service: "selector가 같은 Application의 Helm chart가 만든 Pod를 가리킴 (이 폴더만 보면 짝이 없어 보이는 오탐)"
  name: alloy-gateway-syslog-lan
  namespace: observability
spec:
  type: LoadBalancer
  ports:
    - name: syslog
      port: 5514
      targetPort: 5514
      protocol: UDP
    - name: syslog-coral
      port: 5515
      targetPort: 5515
      protocol: UDP
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy-gateway
