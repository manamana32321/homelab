apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    # Blackbox Exporter 알림 (kube-prometheus-stack 기본에 없음)
    - name: blackbox
      rules:
        - alert: EndpointDown
          expr: probe_success == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "엔드포인트 응답 없음"
            description: "{{ $labels.instance }} ({{ $labels.job }})이 2분간 probe 실패."

        - alert: TLSCertExpiringSoon
          expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS 인증서 만료 임박"
            description: "{{ $labels.instance }} 인증서가 {{ $value | humanize }}일 뒤 만료."

        - alert: SlowResponse
          expr: avg_over_time(probe_duration_seconds[5m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "엔드포인트 응답 지연"
            description: "{{ $labels.instance }} 5분 평균 응답 {{ $value | humanize }}초."

    # 스토리지 알림 (kube-prometheus-stack 기본에 PVC/디스크 임계치 rule 없음)
    - name: storage
      rules:
        - alert: PVCAlmostFull
          expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC 용량 임박"
            description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} {{ $value | humanizePercentage }} 사용."

        - alert: NodeUnderDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",job="kube-state-metrics",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "노드 DiskPressure"
            description: "{{ $labels.node }} kubelet이 ephemeral-storage 회수를 위해 파드를 축출 중."

        - alert: NodeDiskAlmostFull
          # SSD(`/`): 95% — Longhorn replica sparse 누적은 Trim Filesystem으로 회수 가능, 늦게 알려도 무방.
          # kube-prometheus-stack의 `NodeFilesystemSpaceFillingUp` (predict_linear 4h)이 임박 위험을 별도 catch.
          expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs",mountpoint!~"/mnt/hdd-.*"} / node_filesystem_size_bytes{fstype=~"ext4|xfs",mountpoint!~"/mnt/hdd-.*"}) > 0.95
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "디스크 용량 임박"
            description: "{{ $labels.instance }} {{ $labels.mountpoint }} {{ $value | humanizePercentage }} 사용."

        - alert: HDDAlmostFull
          # HDD(`/mnt/hdd-*`): 75% — 미디어 누적이라 회수 불가, 일찍 경고해 정리/확장 시간 확보.
          expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs",mountpoint=~"/mnt/hdd-.*"} / node_filesystem_size_bytes{fstype=~"ext4|xfs",mountpoint=~"/mnt/hdd-.*"}) > 0.75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HDD 용량 임박"
            description: "{{ $labels.instance }} {{ $labels.mountpoint }} {{ $value | humanizePercentage }} 사용."

    # SMART 디스크 건강 알림 (ATA HDD 특화 — NVMe 기본 알림은 smartctl-exporter chart에 내장)
    - name: smart
      rules:
        - alert: DiskPendingSectors
          # TODO(2026-12): sdc 디스크 교체 후 원복 — 기존: > 0
          # sdc는 pending 2개가 물리적으로 복구 불가 상태이므로 3개 이상만 알림
          expr: >-
            smartctl_device_attribute{attribute_name="Current_Pending_Sector", attribute_value_type="raw"} > 0
            unless
            (smartctl_device_attribute{attribute_name="Current_Pending_Sector", attribute_value_type="raw", device="sdc"} <= 2)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "디스크 pending 섹터 발생"
            description: "{{ $labels.instance }} {{ $labels.device }} pending 섹터 {{ $value }}개."

        - alert: DiskReallocatedSectors
          expr: >-
            smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"} > 0
            unless
            (smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw", device="sda", node="json-server-1"} <= 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "디스크 재할당 섹터 발생"
            description: "{{ $labels.instance }} {{ $labels.device }} 재할당 섹터 {{ $value }}개."

        - alert: DiskReallocatedSectorsCritical
          expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"} > 100
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "디스크 재할당 섹터 다수"
            description: "{{ $labels.instance }} {{ $labels.device }} 재할당 섹터 {{ $value }}개."

        # SMART overall verdict — 벤더 normalized threshold가 깨질 때 발화.
        # reallocation 외의 실패 모드(spin-up 열화, read error rate, retry count 등)도
        # 잡아냄. 어떤 attribute가 원인인지는 smartctl -A로 별도 확인 필요.
        # smartctl-exporter chart의 smartCTLDeviceStatus 룰은 메트릭명 버그로
        # (smartctl_device_status, 미존재) 작동하지 않아 직접 정의함.
        - alert: DiskSmartFailed
          expr: smartctl_device_smart_status != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART 종합 판정 FAIL"
            description: "{{ $labels.instance }} {{ $labels.device }} SMART overall-health = FAILED."

    - name: power
      rules:
        - alert: NodeUndervoltage
          expr: max_over_time(node_hwmon_in_lcrit_alarm_volts{chip="soc:firmware_raspberrypi_hwmon"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "전원 언더볼티지"
            description: "{{ $labels.instance }} 전원 전압이 최근 15분 내 임계 이하로 하강."

    # CrowdSec IPS 알림
    - name: crowdsec
      rules:
        - alert: CrowdSecHighBanRate
          # CAPI(커뮤니티 블록리스트) 제외 — 2시간마다 ~15K건 벌크 동기화로 false positive 발생
          expr: increase(cs_active_decisions{origin!="CAPI"}[5m]) > 50
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec 차단 급증"
            description: "5분간 로컬 차단 판단 {{ $value | humanize }}건."

        - alert: CrowdSecLAPIDown
          expr: up{job=~".*crowdsec-lapi.*"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec LAPI 응답 없음"
            description: "LAPI가 3분간 메트릭을 노출하지 않음."

    # 리소스 알림 (kube-prometheus-stack 기본 NodeMemory rule은 예측 기반이라 직관적이지 않음)
    - name: resources
      rules:
        - alert: HighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "노드 메모리 사용률 높음"
            description: "{{ $labels.instance }} 메모리 {{ $value | humanizePercentage }} 사용."

        # chart 룰 CPUThrottlingHigh(info, 5m window)는 짧은 버스트성 스로틀링까지
        # 잡아 info noise로 묻힌다. wedge된 컨트롤러(예: minio-operator의
        # PolicyBinding watch hot-loop)는 CPU limit에 몇 시간씩 연속으로 붙어
        # ~100% 스로틀된다 — 버스트와 명확히 구분되는 고신뢰 신호이므로
        # 더 긴 window + warning으로 별도 발화. CPUThrottlingHigh의 컴포넌트별
        # 재정의가 아니라, sustained 케이스 전용 상위 severity tier.
        - alert: ContainerCPUThrottlingSustained
          expr: >-
            sum by (namespace, pod, container) (
              rate(container_cpu_cfs_throttled_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor"}[15m])
            )
            /
            sum by (namespace, pod, container) (
              rate(container_cpu_cfs_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor"}[15m])
            )
            > 0.9
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "컨테이너 CPU 스로틀 지속"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.container }}가 2시간 동안 {{ $value | humanizePercentage }} 스로틀."

    # ArgoCD 앱 health — chart의 ArgoAppMissing/ArgoAppNotSynced로는 못 잡는
    # Degraded/Missing/Unknown 상태를 12h 기다리지 않고 catch.
    # Healthy/Progressing/Suspended는 의도적 정상 상태이므로 제외.
    # ArgoAppMissing(controller 침묵), ArgoAppNotSynced(12h drift)는
    # argo-cd chart values의 controller.metrics.rules에서 관리.
    - name: argocd
      rules:
        - alert: ArgoAppDegraded
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD 애플리케이션 degraded"
            description: "{{ $labels.name }} (ns {{ $labels.dest_namespace }})이 10분 이상 {{ $labels.health_status }} 상태."

    # Image Updater silent CD failure 감지.
    # 정책상 모든 커스텀 앱이 Image Updater에 의존하므로 (k8s/CLAUDE.md 참조),
    # 이게 silent fail하면 "왜 새 commit이 배포 안 되지?" 디버깅 헛수고로 이어짐.
    # 메트릭 출처: argocd-image-updater chart 0.12.0+
    - name: argocd-image-updater
      rules:
        # ArgoCD API write 실패 — argocd 모드에서 digest override를 Application CR에
        # 박지 못함. 새 image 빌드돼도 배포 안 되는 가장 silent한 critical 시나리오.
        - alert: ImageUpdaterArgoApiErrors
          expr: increase(argocd_image_updater_k8s_api_errors_total[15m]) >= 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Image Updater ArgoCD API 에러"
            description: "15분간 ArgoCD API 에러 {{ $value | humanize }}건."

        # per-app 처리 에러 sustained — registry pull-secret 만료, annotation 오타,
        # GHCR 일시 장애 등. application 라벨로 어느 앱이 문제인지 분리해서 알림.
        - alert: ImageUpdaterImageErrors
          expr: increase(argocd_image_updater_images_errors_total[30m]) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Image Updater 처리 에러"
            description: "{{ $labels.application }} 30분간 처리 에러 {{ $value | humanize }}건."

        # pod up이지만 폴링 멈춤 — 내부 hang, config 오류, network 문제.
        # 정상 시 7개 app × 2분 폴링 = ~210 요청/h이므로 15분간 0이면 명백히 stuck.
        - alert: ImageUpdaterStuck
          expr: rate(argocd_image_updater_registry_requests_total[15m]) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Image Updater 레지스트리 폴링 정지"
            description: "{{ $labels.registry }} 폴링이 15분 이상 0건."

    # minio-operator zombie 감지 — leader pod이 CPU throttling으로 lease를 잃은 뒤
    # 재캠페인 goroutine이 deadlock에 빠지면 TCP는 살아있지만 reconcile 멈춤.
    # v7.1.1 binary는 health endpoint를 노출하지 않아 livenessProbe로 못 잡음.
    # 대신 kube-state-metrics의 lease renewTime을 watcher로 사용.
    - name: minio-operator
      rules:
        - alert: MinIOOperatorLeaseStale
          expr: (time() - kube_lease_renew_time{lease="minio-operator-lock"}) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "minio-operator lease 갱신 정지"
            description: "{{ $labels.namespace }}/{{ $labels.lease }}이 {{ $value | humanizeDuration }} 동안 미갱신."

    # gbrain-sync cron 신선도 감지 — git(brain repo) → Postgres 인덱스 동기화가
    # 지속적으로 실패하면 brain 검색 결과가 stale해진다.
    # kube-prometheus-stack의 KubeJobFailed는 잡 오브젝트 존재로 발화해 일시적
    # 실패에도 잔재 알림이 남는다(→ CronJob failedJobsHistoryLimit=0으로 소스 차단).
    # 대신 "마지막 성공 이후 경과 시간"으로 지속 장애만 잡고 성공 시 자동 해소.
    # 정상 cadence 주의: sync ~17분 + concurrencyPolicy=Forbid → 성공 완료 간격이
    # ~20분으로 벌어지므로 임계를 넉넉히(1h) 잡아 false positive를 피한다.
    - name: gbrain
      rules:
        - alert: GbrainSyncStale
          expr: (time() - kube_cronjob_status_last_successful_time{cronjob="gbrain-sync"}) > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "gbrain-sync 성공 없음"
            description: "마지막 성공 이후 {{ $value | humanizeDuration }} 경과."
