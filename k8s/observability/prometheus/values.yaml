# K3s는 controller-manager, scheduler, proxy, etcd가 k3s server에 내장되어
# 별도 metrics endpoint를 노출하지 않음 → 스크랩/rule 비활성화
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
# K3s embedded etcd는 :2381 metrics endpoint 미노출. 룰 15개가 dead weight였음
kubeEtcd:
  enabled: false

prometheus-node-exporter:
  dnsPolicy: Default
  # DiskPressure 로 evict 되면 안 된다. evict 되는 순간 그 노드의 filesystem 메트릭이
  # 끊기고, NodeFilesystemAlmostOutOfSpace(for: 30m) 등 디스크 알림의 for 타이머가
  # 리셋된다. pod 이 재생성됐다 다시 evict 되기를 반복하면 알림은 영원히 pending 에
  # 머물러 firing 하지 못한다 - 알리려던 조건이 알리는 장치를 죽이는 구조.
  # system-node-critical 은 kubelet 의 eviction 후보에서 사실상 제외된다.
  priorityClassName: system-node-critical

grafana:
  enabled: false

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: json-server-1
    # AlertmanagerConfig CR 의 route 에 namespace matcher 를 붙이지 않는다.
    # discord CR 이 전체 경보를 받아야 하므로.
    alertmanagerConfigMatcherStrategy:
      type: None
  config:
    global:
      resolve_timeout: 5m
    route:
      # 실제 발송은 AlertmanagerConfig `discord` 가 담당 (manifests/alertmanagerconfig-discord.yaml).
      # 여기 receiver 는 그 route 에도 안 걸린 경보의 fallback 이다.
      receiver: "null"
    receivers:
      - name: "null"

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    nodeSelector:
      kubernetes.io/hostname: json-server-1

  # Prometheus는 자체 인증 기능이 없어 ingress가 곧 무인증 공개 API가 된다.
  # Alertmanager와 동일하게 외부 노출하지 않고 port-forward로만 접근한다:
  #   kubectl port-forward -n observability svc/prometheus-kube-prometheus-prometheus 9090:9090
  # 대시보드는 Grafana(ClusterIP 스크레이프)가 담당하므로 일상 조회에 영향 없다.
  ingress:
    enabled: false
