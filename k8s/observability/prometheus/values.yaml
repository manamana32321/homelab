# K3s는 controller-manager, scheduler, proxy, etcd가 k3s server에 내장되어
# 별도 metrics endpoint를 노출하지 않음 → 스크랩/rule 비활성화
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
# K3s embedded etcd는 :2381 metrics endpoint 미노출. 룰 15개가 dead weight였음
kubeEtcd:
  enabled: false

prometheus-node-exporter:
  dnsPolicy: Default

grafana:
  enabled: false

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: json-server-1
    secrets:
      - alertmanager-telegram
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # kube-prometheus-stack 기본 watchdog alert 무시
        - match:
            alertname: Watchdog
          receiver: "null"
        - match:
            alertname: InfoInhibitor
          receiver: "null"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id: -1003865568684
            message_thread_id: 206
            api_url: https://api.telegram.org
            parse_mode: HTML
            message: |-
              {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} <b>[K8s] {{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    nodeSelector:
      kubernetes.io/hostname: json-server-1

  # Prometheus는 자체 인증 기능이 없어 ingress가 곧 무인증 공개 API가 된다.
  # Alertmanager와 동일하게 외부 노출하지 않고 port-forward로만 접근한다:
  #   kubectl port-forward -n observability svc/prometheus-kube-prometheus-prometheus 9090:9090
  # 대시보드는 Grafana(ClusterIP 스크레이프)가 담당하므로 일상 조회에 영향 없다.
  ingress:
    enabled: false
