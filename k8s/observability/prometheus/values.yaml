# K3s는 controller-manager, scheduler, proxy, etcd가 k3s server에 내장되어
# 별도 metrics endpoint를 노출하지 않음 → 스크랩/rule 비활성화
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
# K3s embedded etcd는 :2381 metrics endpoint 미노출. 룰 15개가 dead weight였음
kubeEtcd:
  enabled: false

prometheus-node-exporter:
  dnsPolicy: Default

grafana:
  enabled: false

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: json-server-1
    # AlertmanagerConfig CR 의 route 에 namespace matcher 를 붙이지 않는다.
    # discord CR 이 전체 경보를 받아야 하므로.
    alertmanagerConfigMatcherStrategy:
      type: None
  config:
    global:
      resolve_timeout: 5m
    route:
      # 실제 발송은 AlertmanagerConfig `discord` 가 담당 (manifests/alertmanagerconfig-discord.yaml).
      # 여기 receiver 는 그 route 에도 안 걸린 경보의 fallback 이다.
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # kube-prometheus-stack 기본 watchdog alert 무시
        - match:
            alertname: Watchdog
          receiver: "null"
        - match:
            alertname: InfoInhibitor
          receiver: "null"
    receivers:
      - name: "null"

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    nodeSelector:
      kubernetes.io/hostname: json-server-1

  # Prometheus는 자체 인증 기능이 없어 ingress가 곧 무인증 공개 API가 된다.
  # Alertmanager와 동일하게 외부 노출하지 않고 port-forward로만 접근한다:
  #   kubectl port-forward -n observability svc/prometheus-kube-prometheus-prometheus 9090:9090
  # 대시보드는 Grafana(ClusterIP 스크레이프)가 담당하므로 일상 조회에 영향 없다.
  ingress:
    enabled: false
