# K3s는 controller-manager, scheduler, proxy, etcd가 k3s server에 내장되어
# 별도 metrics endpoint를 노출하지 않음 → 스크랩/rule 비활성화
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
# K3s embedded etcd는 :2381 metrics endpoint 미노출. 룰 15개가 dead weight였음
kubeEtcd:
  enabled: false

prometheus-node-exporter:
  dnsPolicy: Default

grafana:
  enabled: false

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: json-server-1
    secrets:
      - alertmanager-discord
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # kube-prometheus-stack 기본 watchdog alert 무시
        - match:
            alertname: Watchdog
          receiver: "null"
        - match:
            alertname: InfoInhibitor
          receiver: "null"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            title: '{{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} [K8s] {{ .Status | toUpper }}'
            message: |-
              {{ range .Alerts }}
              **{{ .Labels.alertname }}** ({{ .Labels.severity }})
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    nodeSelector:
      kubernetes.io/hostname: json-server-1

  ingress:
    enabled: true
    hosts:
      - prometheus.json-server.win
    paths:
      - /
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
      traefik.ingress.kubernetes.io/redirect-entry-point: https
    ingressClassName: traefik
    tls:
      - hosts:
          - prometheus.json-server.win
        secretName: prometheus-tls
