# 노드마다 물리 디스크 구성이 달라 인스턴스를 분리한다.
# base 인스턴스 = json-server-1, extraInstances = json-server-2.
# raspi-1 은 SD카드라 SMART 자체가 없어 어느 쪽에도 넣지 않는다.
#
# sdd 이후는 두 노드 모두 Longhorn iSCSI 가상 디스크이므로 대상에서 뺀다.
# 물리 ATA 디스크가 항상 앞 글자를 차지하는 건 ATA 가 부팅 시점에,
# iSCSI 로그인은 k3s 기동 후에 일어나기 때문이다.
config:
  devices:
    - /dev/sda # WD Green 240GB — root. kine SQLite + 스왑이 여기 (DRAM-less)
    - /dev/sdb # Seagate ST1000DM003 1TB — /mnt/hdd-seagate-1t
    - /dev/sdc # Samsung HM641JI 640GB — /mnt/hdd-samsung-640g

common:
  config:
    collect_not_more_than_period: 300s

nodeSelector:
  kubernetes.io/hostname: json-server-1

extraInstances:
  - config:
      devices:
        - /dev/sda # Samsung SSD 830 119GB — root
    nodeSelector:
      kubernetes.io/hostname: json-server-2
    # 차트 템플릿이 `toYaml $item.resources` 를 with 가드 없이 렌더하므로
    # 생략하면 매니페스트에 null 이 박힌다. 반드시 명시할 것.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 64Mi

serviceMonitor:
  enabled: true
  extraLabels:
    release: prometheus
  interval: 5m
  scrapeTimeout: 30s
  # 노출되는 라벨이 pod IP(instance)뿐이라 어느 노드의 디스크인지 알 수 없다.
  # 두 노드 모두 /dev/sda 를 갖고 있어 device 라벨만으로는 구분이 안 되므로
  # 알림 룰이 노드를 지목할 수 있도록 node 라벨을 붙인다.
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node

prometheusRules:
  enabled: true
  extraLabels:
    release: prometheus
  rules:
    # NVMe 전용 메트릭 — SATA HDD 환경에선 metric 자체가 없어 발화 불가
    smartCTLDeviceMediaErrors:
      enabled: false
    smartCTLDeviceCriticalWarning:
      enabled: false
    smartCTLDeviceAvailableSpareUnderThreshold:
      enabled: false
    # chart 버그: expr이 `smartctl_device_status`(미존재) 참조.
    # 실제 메트릭명은 `smartctl_device_smart_status` →
    # homelab-alerts의 DiskSmartFailed 룰로 대체
    smartCTLDeviceStatus:
      enabled: false
    smartCTLDInterfaceSlow:
      enabled: false
    smartCTLDDeviceTemperature:
      enabled: true
      expr: smartctl_device_temperature{temperature_type="current"} > 55

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 64Mi
