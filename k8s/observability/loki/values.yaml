deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    type: filesystem
  limits_config:
    retention_period: 30d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  schemaConfig:
    configs:
      - from: 2025-08-15
        object_store: filesystem
        store: tsdb
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  distributor: {otlp_config: {default_resource_attributes_as_index_labels:
            # these keys will be indexed
            ['service.name', 'service.version', 'service.environment']}}

chunksCache:
  enabled: false

resultsCache:
  allocatedMemory: 256
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

gateway:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  nodeSelector:
    kubernetes.io/hostname: json-server-1
  persistence:
    storageClass: longhorn-ssd
    enableStatefulSetAutoDeletePVC: false

