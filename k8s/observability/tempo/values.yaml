# Tempo Single Binary Mode
# https://github.com/grafana-community/helm-charts/tree/main/charts/tempo

tempo:
  # OTLP gRPC receiver
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

  retention: 720h    # 30d
  queryFrontend:
    mcp_server:
      enabled: true
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

persistence:
  enabled: true
  size: 10Gi
  storageClassName: local-path-hdd-samsung
nodeSelector:
  kubernetes.io/hostname: json-server-1
