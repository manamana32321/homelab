apiVersion: batch/v1
kind: CronJob
metadata:
  name: brain-agent-morning
  namespace: automation
  labels:
    app: brain-agent
    job-type: morning-brief
spec:
  # 2026-08-10 정지. 브리핑을 거의 보지 않아 매일 아침 알림이 노이즈만 됐다.
  # 스크립트·시크릿 참조는 그대로 두므로 되살릴 때 이 줄만 지우면 된다.
  # 참고: essentia 07:00 KST 다이제스트는 2026-07-22부터 이미 정지 상태
  # (k8s/essentia/kustomization.yaml replicas 0).
  suspend: true
  # 07:30 KST = 22:30 UTC (previous day)
  schedule: "30 22 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: brain-agent
            job-type: morning-brief
        spec:
          restartPolicy: Never
          containers:
            - name: brain-agent
              image: python:3.12-slim
              command:
                - sh
                - -c
                - |
                  set -eo pipefail
                  pip install --quiet --no-cache-dir httpx==0.28.1
                  python /scripts/morning-brief.py
              env:
                - name: HEALTH_HUB_URL
                  value: "https://health.json-server.win"
                - name: TZ
                  value: "Asia/Seoul"
                # CANVAS_BASE_URL은 sensitive 아님 — env value로
                - name: CANVAS_BASE_URL
                  value: "https://canvas.skku.edu"
                # health-hub-api-token: health-hub ns에서 reflect됨
                - name: HEALTH_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: health-hub-api-token
                      key: API_TOKEN
                # canvas-credentials: essentia ns에서 reflect됨
                - name: CANVAS_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: canvas-credentials
                      key: CANVAS_ACCESS_TOKEN
                # alertmanager-telegram: observability ns에서 reflect됨
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: alertmanager-telegram
                      key: bot-token
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: alertmanager-telegram
                      key: chat-id
                - name: TELEGRAM_THREAD_ID
                  valueFrom:
                    secretKeyRef:
                      name: alertmanager-telegram
                      key: message-thread-id
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: brain-agent-script
                defaultMode: 0555
