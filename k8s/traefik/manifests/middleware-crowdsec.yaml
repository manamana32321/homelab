apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: kube-system
spec:
  plugin:
    bouncer:
      enabled: true
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      # LAPI key read from file — secret mounted by Traefik HelmChartConfig
      # (k8s/traefik/manifests/helmchartconfig.yaml) from the
      # crowdsec-bouncer-key Secret reflected from the crowdsec namespace.
      # The plugin prefers crowdsecLapiKeyFile over inline crowdsecLapiKey.
      crowdsecLapiKeyFile: /run/secrets/crowdsec/lapi-key
      updateIntervalSeconds: 60
      defaultDecisionSeconds: 60
      updateMaxFailure: -1
      # Use X-Forwarded-For only from Cloudflare edges (proxied hosts).
      # Keep in sync with ports.websecure.forwardedHeaders.trustedIPs in
      # helmchartconfig.yaml. https://www.cloudflare.com/ips/
      forwardedHeadersTrustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
