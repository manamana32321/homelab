# minio-operator zombie reaper
#
# 왜 필요한가 — operator v7.1.1 의 leader election 은 lease 갱신에 실패하면
# OnStoppedLeading 에서 컨트롤러(work queue + operator:4221 / sts:4223 웹서버)를
# 내리고 election context 를 cancel 한 뒤, StartOperator 가 `<-stopCh` 에서 영구
# 블록된다. os.Exit 도 재선출 진입도 없다. 즉 프로세스는 살아있고 kubelet 은
# 1/1 Running 으로 보지만 실제로는 아무 일도 하지 않는다. replica 2개가 연달아
# 이렇게 죽으면 Tenant 재조정이 전면 중단된다. 좀비는 CPU limit(1코어)에 붙어서
# 계속 돌기까지 해 control-plane 부하를 올리고 다음 재발 확률을 스스로 높인다.
#
# 왜 probe 가 아닌가 — 차트 7.1.1 은 operator Deployment 에 probe 필드를 노출하지
# 않는다 (values 스키마에 없음). helm 소스를 kustomize helmCharts inflator 로
# 갈아끼우면 patch 가 가능하지만, 4000줄짜리 CRD 를 렌더 경로째 바꾸는 위험 대비
# 이득이 적다. 좀비 시그니처가 lease 두 필드로 정확히 판별되므로 외부 감시로 처리.
#
# 판정 — 아래 둘 중 하나면 좀비다. 두 경로 모두 실제로 관측됐다.
#   1. holderIdentity 가 "" — client-go 가 리더십 상실 시 lease 를 정상 반납한
#      경우. 살아있는 후보가 하나라도 있으면 1~5초 안에 다시 채워진다.
#   2. holderIdentity 는 남아있는데 renewTime 이 STALE_AFTER 초 이상 낡음 —
#      반납 요청 자체가 apiserver 타임아웃으로 실패한 경우
#      (`leaderelection.go:322] Failed to release lock`). 죽은 파드 이름이 lease 에
#      박제되어 홀더만 보는 판정은 이걸 "건강"으로 오독한다.
# 임계값 180초 = leaseDurationSeconds(60) 의 3배이자 MinIOOperatorLeaseStale
# 알람 임계값(5분)보다 짧다. 즉 알람이 울리기 전에 자동 회수된다.
# 오탐을 막으려 30초 간격으로 두 번 확인하고 둘 다 좀비일 때만 파드를 지운다.
# apiserver 가 통째로 죽은 상황에서는 리퍼 자신이 API 에 못 붙어 Job 이 실패하므로
# 애먼 파드를 지우지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-operator-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-operator-reaper
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["minio-operator-lock"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-operator-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minio-operator-reaper
subjects:
  - kind: ServiceAccount
    name: minio-operator-reaper
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-operator-reaper
  labels:
    app: minio-operator
    job-type: watchdog
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # 실패 Job 은 GC 전까지 KubeJobFailed 가 firing 상태로 남는다. 감시 job 이
  # 알람 소스가 되면 본말전도이므로 히스토리를 짧게 유지.
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # 30초 recheck 를 포함해도 1분이면 끝난다. 데드라인이 없으면 무언가 매달렸을 때
      # 조용히 남는다 (loop-migrate 가 정확히 그렇게 됐다, #265).
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: minio-operator-reaper
          containers:
            - name: reaper
              # 셸이 필요하다. rancher/kubectl 은 18MB distroless 라 `sh` 가 없어
              # StartError 로 죽는다 (#264 배포 후 실측). alpine/k8s 는 busybox 셸 +
              # kubectl 을 포함하고 태그가 클러스터 버전(K3s v1.34.5)과 일치한다.
              image: alpine/k8s:1.34.5
              command:
                - sh
                - -c
                - |
                  set -eo pipefail
                  LEASE="lease/minio-operator-lock"
                  STALE_AFTER=180

                  # 좀비면 사유를 stdout 으로, 건강하면 아무것도 출력하지 않는다.
                  zombie_reason() {
                    lease=$(kubectl get $LEASE \
                      -o jsonpath='{.spec.holderIdentity} {.spec.renewTime}')
                    holder=${lease% *}
                    renew=${lease#* }

                    if [ -z "$holder" ]; then
                      echo "holderIdentity is empty"
                      return
                    fi

                    # busybox date 는 RFC3339 를 그대로 못 먹는다. 소수점 이하와 Z 를
                    # 잘라내고 -D 로 입력 포맷을 명시한다 (컨테이너 TZ 는 UTC).
                    renew_at=$(date -u -D '%Y-%m-%d %H:%M:%S' \
                      -d "$(echo "$renew" | cut -c1-19 | tr T ' ')" +%s)
                    age=$(( $(date -u +%s) - renew_at ))

                    if [ "$age" -gt "$STALE_AFTER" ]; then
                      echo "holder=$holder but renewTime is ${age}s old (> ${STALE_AFTER}s)"
                    fi
                  }

                  reason=$(zombie_reason)
                  if [ -z "$reason" ]; then
                    echo "lease healthy"
                    exit 0
                  fi

                  echo "suspect: $reason — rechecking in 30s to rule out a failover window"
                  sleep 30

                  reason=$(zombie_reason)
                  if [ -z "$reason" ]; then
                    echo "recovered on its own"
                    exit 0
                  fi

                  echo "still zombied after 30s: $reason — deleting operator pods"
                  kubectl delete pod \
                    -l app.kubernetes.io/name=operator,app.kubernetes.io/instance=minio-operator
              securityContext:
                runAsUser: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
