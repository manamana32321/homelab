apiVersion: v1
kind: PersistentVolume
metadata:
  name: seafile-data
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath-hdd
  hostPath:
    # type: Directory — 경로가 없으면 kubelet이 마운트를 거부한다. library-pv.yaml 참조.
    path: /mnt/hdd-seagate-1t/seafile-data
    type: Directory
  claimRef:
    name: seafile-data
    namespace: seafile
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - json-server-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data
  namespace: seafile
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath-hdd
  resources:
    requests:
      storage: 100Gi
  volumeName: seafile-data
