apiVersion: batch/v1
kind: CronJob
metadata:
  name: lifehub-habits-auto
  namespace: health-hub
  labels:
    app: lifehub-api
    job-type: habits-auto
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: lifehub-api
            job-type: habits-auto
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: habits-auto
              image: ghcr.io/manamana32321/lifehub-api:latest
              imagePullPolicy: Always
              command: ["node", "dist/cli.js", "habits", "auto", "--days", "3"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
                - name: DB_HOST
                  value: timescaledb
                - name: DB_PORT
                  value: "5432"
                - name: DB_USER
                  value: healthhub
                - name: DB_NAME
                  value: healthhub
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: health-hub-secret
                      key: DB_PASSWORD
                - name: DEFAULT_TIMEZONE
                  value: Asia/Seoul
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
