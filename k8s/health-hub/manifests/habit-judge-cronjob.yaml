apiVersion: batch/v1
kind: CronJob
metadata:
  name: lifehub-habit-judge
  namespace: health-hub
  labels:
    app.kubernetes.io/part-of: lifehub
    app.kubernetes.io/component: cronjob
spec:
  schedule: "*/15 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: lifehub
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: judge
              image: ghcr.io/manamana32321/lifehub-api:latest
              command: ["node", "dist/cli.js", "habits", "auto", "--days", "2"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
                - name: DB_HOST
                  value: timescaledb
                - name: DB_PORT
                  value: "5432"
                - name: DB_USER
                  value: healthhub
                - name: DB_NAME
                  value: healthhub
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: health-hub-secret
                      key: DB_PASSWORD
                - name: DEFAULT_TIMEZONE
                  value: Asia/Seoul
                - name: PROMETHEUS_URL
                  value: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
                - name: PRESENCE_PHONE_MAC
                  value: "BE:4F:43:38:44:31"
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
