apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-hub-dashboard
  namespace: health-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-hub-dashboard
  template:
    metadata:
      labels:
        app: health-hub-dashboard
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/manamana32321/lifehub-web:latest
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LIFEHUB_API_URL
              value: http://lifehub-api:8080
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: health-hub-api-token
                  key: API_TOKEN
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: health-hub-dashboard
  namespace: health-hub
spec:
  selector:
    app: health-hub-dashboard
  ports:
    - port: 3000
      targetPort: http
      name: http
