container_runtime: containerd

config:
  parsers:
    s02-enrich:
      # Home devices reaching Cloudflare-proxied hosts egress via the home
      # public IP. It is dynamic, so resolve the DDNS-managed origin record
      # (openwrt/config/ddns) instead of hardcoding it.
      home-ip-whitelist.yaml: |
        name: homelab/home-ip-whitelist
        description: "Whitelist the home public IP (origin.json-server.win)"
        whitelist:
          reason: "home public IP"
          expression:
            - evt.Meta.source_ip in LookupHost("origin.json-server.win")
      # Headlamp requests every locale of its prometheus plugin on page load
      # and most 404, which alone trips crowdsecurity/http-probing.
      headlamp-plugin-locales.yaml: |
        name: homelab/headlamp-plugin-locales
        description: "Ignore Headlamp plugin locale 404s"
        whitelist:
          reason: "Headlamp plugin locale 404"
          expression:
            - evt.Meta.target_fqdn == "k8s.json-server.win" && evt.Meta.http_status == "404" && evt.Meta.http_path matches "^/static-plugins/[^/]+/locales/"

agent:
  # Single Deployment tailing Traefik access logs from Loki (shipped by Alloy
  # from every node), so the agent is independent of where Traefik runs and
  # needs no /var/log hostPath.
  isDeployment: true
  hostVarLog: false
  acquisition: []
  additionalAcquisition:
    - source: loki
      url: http://loki.observability.svc:3100
      query: '{namespace="kube-system", container="traefik"}'
      # Default 30s stops the source (agent restarts) on a brief Loki restart.
      max_failure_duration: 5m
      labels:
        type: traefik
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/traefik crowdsecurity/http-cve"
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

lapi:
  env:
    - name: BOUNCER_KEY_traefik
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer-key
          key: BOUNCER_KEY_traefik
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus
  persistentVolume:
    data:
      enabled: true
      storageClassName: longhorn-ssd
      size: 1Gi
    config:
      enabled: true
      storageClassName: longhorn-ssd
      size: 512Mi
