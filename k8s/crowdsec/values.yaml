container_runtime: containerd

config:
  parsers:
    s02-enrich:
      # Home devices reaching Cloudflare-proxied hosts egress via the home
      # public IP. It is dynamic, so resolve the DDNS-managed origin record
      # (openwrt/config/ddns) instead of hardcoding it.
      home-ip-whitelist.yaml: |
        name: homelab/home-ip-whitelist
        description: "Whitelist the home public IP (origin.json-server.win)"
        whitelist:
          reason: "home public IP"
          expression:
            - evt.Meta.source_ip in LookupHost("origin.json-server.win")
      # Headlamp requests every locale of its prometheus plugin on page load
      # and most 404, which alone trips crowdsecurity/http-probing.
      headlamp-plugin-locales.yaml: |
        name: homelab/headlamp-plugin-locales
        description: "Ignore Headlamp plugin locale 404s"
        whitelist:
          reason: "Headlamp plugin locale 404"
          expression:
            - evt.Meta.target_fqdn == "k8s.json-server.win" && evt.Meta.http_status == "404" && evt.Meta.http_path matches "^/static-plugins/[^/]+/locales/"
      # A banned client keeps getting the bouncer's own 403 (OriginStatus 0,
      # never reached a backend); counting those re-bans it via 403-bf right
      # after a manual unban, before the bouncer cache refreshes.
      bouncer-403.yaml: |
        name: homelab/bouncer-403
        description: "Ignore 403s generated by the CrowdSec bouncer itself"
        whitelist:
          reason: "bouncer 403"
          expression:
            - evt.Meta.http_status == "403" && int(evt.Unmarshaled.traefik.OriginStatus ?? -1) == 0
      # Next.js App Router prefetches every <Link> in the viewport as a
      # `?_rsc=` request, so opening a team list fires 40+ in seconds and trips
      # crowdsecurity/http-crawl-non_statics, banning real (mobile CGNAT) users.
      amang-rsc-prefetch.yaml: |
        name: homelab/amang-rsc-prefetch
        description: "Ignore Next.js RSC requests on AMANG web"
        whitelist:
          reason: "AMANG Next.js RSC prefetch"
          expression:
            - evt.Meta.target_fqdn in ["amang.json-server.win", "amang.staging.json-server.win"] && evt.Meta.http_path contains "_rsc="

agent:
  # Single Deployment tailing Traefik access logs from Loki (shipped by Alloy
  # from every node), so the agent is independent of where Traefik runs and
  # needs no /var/log hostPath.
  isDeployment: true
  hostVarLog: false
  acquisition: []
  additionalAcquisition:
    - source: loki
      url: http://loki.observability.svc:3100
      query: '{namespace="kube-system", container="traefik"}'
      # Default 30s stops the source (agent restarts) on a brief Loki restart.
      max_failure_duration: 5m
      labels:
        type: traefik
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/traefik crowdsecurity/http-cve"
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

lapi:
  env:
    - name: BOUNCER_KEY_traefik
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer-key
          key: BOUNCER_KEY_traefik
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus
  persistentVolume:
    data:
      enabled: true
      storageClassName: longhorn-ssd
      size: 1Gi
    config:
      enabled: true
      storageClassName: longhorn-ssd
      size: 512Mi
