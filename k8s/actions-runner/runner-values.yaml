# ARC Runner Scale Set — bconnect CI + kiscon-sync 러너
# GitHub Actions 유료분 소진 대응으로 CI 를 self-hosted 로 회귀 (CEO 제안).
# self-hosted 러너는 hosted 분 quota/spending-limit 대상이 아니라 청구 막혀도 계속 돎.
# githubConfigUrl 은 canonical bconnect 필수 — 내부 actions/runner-registration 이 repo
# rename redirect 를 안 따라가므로 옛 morton URL 로는 fresh 등록 시 404.
# GitHub App 인증 → SealedSecret (github-app-secret).
githubConfigUrl: "https://github.com/mortonCareer/bconnect"
githubConfigSecret: github-app-secret

controllerServiceAccount:
  name: arc-controller-gha-rs-controller
  namespace: actions-runner

# dind — ci-api 가 Testcontainers(postgresql) 사용 → gradle build 시 docker daemon 필요.
# chart 가 privileged dind sidecar 주입 + runner 에 DOCKER_HOST/소켓 마운트 배선.
# k3s 는 PSP 없어 privileged 허용.
containerMode:
  type: "dind"

# maxRunners 는 amd64 노드 2대(json-server-1/2, 각 16Gi)의 실메모리 여유 기준 —
# minecraft 정지 + loki chunks-cache 비활성으로 확보 (#261). CI 7개 잡이 1~2 웨이브로 돎.
#
# minRunners 2 (#268 3순위). 캐시를 회선에서 빼기 전에 러너를 늘리면 같은 경합이
# 반복되므로 #269·#270 배포·검증 뒤로 미뤄뒀던 항목이다.
#
# 실측: 런 생성 → 잡 시작이 1차 웨이브 37~44초. ci-career 는 needs: changes 라
# 파드 콜드스타트를 두 번 물어 80~104초. 이미지 핀 + IfNotPresent 로 레지스트리
# 왕복은 이미 사라졌고, 남은 시간은 스케줄링 + init-dind-externals + dockerd 기동
# + cache-perms + 러너 등록이다. 2 를 미리 띄워 1차 웨이브를 덮는다 — 게이트인
# changes 와 동시 디스패치되는 format 을 둘 다 커버하려면 1 로는 부족하다.
#
# maxRunners 는 그대로라 피크 부하는 불변이다. 대가는 유휴 파드 2개의 영구 예약
# (request 300m/1Gi each = 600m/2Gi)과 idle dockerd 2개 상주. json-server-2 기준
# requests 가 55%→66% CPU, 38%→51% memory 로 오른다.
minRunners: 2
maxRunners: 6

template:
  spec:
    # arm64(raspi-1)는 하드 제외. control-plane(json-server-1)은 #261 에서 개방했으나,
    # 2026-07-22 인시던트에서 러너 6개가 전량 json-server-1 로 착륙 + 백업 크론 3개 동시
    # 실행이 겹쳐 node_load1 112 까지 치솟아 apiserver 응답이 지연됐다. 그 여파로
    # minio-operator 의 leader lease 갱신(15s deadline)이 두 replica 연속 실패.
    # → worker(json-server-2) 를 선호하고 control-plane 은 오버플로우 전용으로 강등.
    #   soft preference 라 #261 의 동시성 6 목표는 그대로 유지된다.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
    # 노드 로컬 캐시 (#268). 집 회선 100Mbps 가 하드 상한이라 — 동시 6잡의 합산
    # 전송률이 12.9 MB/s 에서 멈추고 이는 이론 상한 12.5 MB/s 와 일치 — 캐시를
    # 네트워크에서 빼는 것 외에 우회로가 없다. hostPath 라 amd64 2대가 각각 한 번씩
    # 채우고, 그 이후로는 setup-node 가 다운로드도 압축해제도 하지 않는다.
    #
    #
    # pnpm store 마운트 위치가 /home/runner/_work/.pnpm-store 인 이유 (#269 배포 검증
    # 에서 정정): pnpm 은 설정된 store 가 프로젝트와 다른 마운트에 있으면 그것을 버리고
    # <프로젝트 마운트 루트>/.pnpm-store 로 store 를 재배치한다. 프로젝트는 emptyDir 인
    # work 볼륨 위에 있으므로, 평범하게 /pnpm 등에 걸면 store 가 emptyDir 로 옮겨가
    # 파드마다 통째로 증발한다 — 캐시가 아예 동작하지 않는다.
    # 그 재배치 목적지에 hostPath 를 직접 걸어 재배치가 영속 볼륨으로 떨어지게 한다.
    volumes:
      - name: pnpm-store
        hostPath:
          path: /var/lib/gha-runner-cache/pnpm
          type: DirectoryOrCreate
      - name: tool-cache
        hostPath:
          path: /var/lib/gha-runner-cache/tool
          type: DirectoryOrCreate
    # kubelet 이 hostPath 를 root:root 0755 로 만들어 runner(uid 1001)가 못 쓴다.
    # 최상위 두 디렉토리만 넘기면 되고(재귀 아님 — 하위는 전부 1001 이 만든다),
    # 러너와 같은 이미지라 추가 pull 이 없다.
    #
    # chart 0.13.1 은 dind 의 init-dind-externals·dind 를 먼저 넣고 이 목록을 뒤에
    # 덧붙인다(덮어쓰지 않음). k8s 1.34 에서 dind 는 native sidecar 라 여기 도달
    # 시점엔 이미 기동돼 있다.
    initContainers:
      - name: cache-perms
        image: ghcr.io/actions/actions-runner:2.336.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command:
          - sh
          - -c
          - set -eu; chown 1001:1001 /pnpm /opt/hostedtoolcache; chmod 755 /pnpm /opt/hostedtoolcache
        volumeMounts:
          - name: pnpm-store
            mountPath: /pnpm
          - name: tool-cache
            mountPath: /opt/hostedtoolcache
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
    containers:
      - name: runner
        # latest 는 kubelet 이 pullPolicy Always 로 해석해 파드마다 레지스트리 왕복이
        # 강제된다. 2.336.0 은 이 커밋 시점 latest 와 동일 digest.
        image: ghcr.io/actions/actions-runner:2.336.0
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        env:
          # pnpm store 를 가리키는 환경변수는 없다. PNPM_STORE_DIR·PNPM_STORE_PATH·
          # npm_config_store_dir·PNPM_HOME·~/.npmrc·~/.config/pnpm/rc·
          # `pnpm config set --global` 전부 재배치를 못 막는다(실측). 유일하게 통하는
          # 건 --store-dir CLI 플래그인데 워크플로 수정이 필요하므로, 대신 재배치
          # 목적지에 볼륨을 거는 방식을 쓴다 — 위 volumes 주석 참조.
          #
          # 러너 툴 캐시. 기본값은 _work/_tool 인데 work 가 emptyDir 라 잡마다
          # 날아가고, 그래서 setup-node 가 매번 node 를 받아 푼다(계측 168~192초,
          # 압축해제만 110.8초). 어느 쪽 이름을 읽는지는 러너 바이너리가 단일 파일
          # 압축이라 정적으로 확인이 안 돼 둘 다 준다. 첫 CI 런에서 실측 확인할 것.
          - name: RUNNER_TOOL_CACHE
            value: /opt/hostedtoolcache
          - name: AGENT_TOOLSDIRECTORY
            value: /opt/hostedtoolcache
        # work 를 여기서 명시하는 건 순서 때문이다. 중첩 마운트라 부모(work)가 먼저
        # 마운트돼야 하는데, chart 는 사용자 마운트를 먼저 쓰고 work 를 뒤에 붙인다.
        # 명시하면 chart 의 $mountWork 가 0 이 되어 재추가하지 않는다. 볼륨 자체는
        # 선언하지 않으므로 chart 가 계속 emptyDir 로 만든다(잡 간 격리 유지).
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: pnpm-store
            mountPath: /home/runner/_work/.pnpm-store
          - name: tool-cache
            mountPath: /opt/hostedtoolcache
        # next build / gradle+testcontainers 피크 대응 상향.
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 300m
            memory: 1Gi
