apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-relay
  labels:
    app: discord-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-relay
  template:
    metadata:
      labels:
        app: discord-relay
    spec:
      # 이미지가 amd64 단일 아키텍처다. raspi-1(arm64)에 스케줄되면
      # ImagePullBackOff 또는 exec format error 로 죽는다.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: relay
          image: ghcr.io/manamana32321/discord-relay:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: discord-relay
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 160Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # node:22-alpine declares `USER node` (named). kubelet cannot
            # verify runAsNonRoot against a named user — must pin numeric.
            # node user is UID 1000 in the alpine image.
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
