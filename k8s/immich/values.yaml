controllers:
  main:
    containers:
      main:
        image:
          tag: v3.1.0
        env:
          DB_HOSTNAME: postgres-svc
          DB_PORT: "5432"
          DB_DATABASE_NAME: immich
          DB_USERNAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: POSTGRES_PASSWORD

immich:
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true

server:
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-dns01
        traefik.ingress.kubernetes.io/redirect-entry-point: https
      hosts:
        - host: photos.json-server.win
          paths:
            - path: /
              service:
                identifier: main
      tls:
        - secretName: immich-tls
          hosts:
            - photos.json-server.win

machine-learning:
  enabled: true
  persistence:
    cache:
      enabled: true
      type: emptyDir

# raspi-1 (arm64, SD카드) 은 immich 워크로드 배치 대상에서 제외한다.
# 최상위 defaultPodOptions 는 server / machine-learning / valkey 세 컴포넌트에 모두 전파된다.
defaultPodOptions:
  nodeSelector:
    kubernetes.io/arch: amd64
