apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-credentials
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/manamana32321/homelab
    targetRevision: main
    path: k8s/cloudflare-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-credentials
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
