## Argo CD configuration
## Ref: https://github.com/argoproj/argo-cd

global:
  domain: argocd.json-server.win
  revisionHistoryLimit: 3
  logging:
    format: json
    level: info

configs:
  params:
    server.insecure: "true"
  cm:
    timeout.reconciliation: 1800s
    # 로그인은 Authentik OIDC만. 앱·로그인 제한 정의: k8s/authentik/manifests/blueprint-argocd.yaml
    # Authentik은 groups를 profile scope에 담아 줌. 별도 groups scope 없음
    oidc.config: |
      name: Authentik
      issuer: https://auth.json-server.win/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc-authentik:clientSecret
      requestedScopes: ["openid", "profile", "email"]
    # 비밀번호 로그인 admin 끔. 비상시엔 kubectl로 argocd-cm/argocd-rbac-cm 수정 (README)
    admin.enabled: "false"
    # AI 에이전트용 로컬 계정. 토큰 발급은 README "AI account token"
    accounts.claude: apiKey
  rbac:
    # 정책에 없는 사용자는 아무 권한 없음
    policy.default: ""
    policy.csv: |
      g, authentik Admins, role:admin
      p, role:claude, applications, sync, */*, allow
      g, role:claude, role:readonly
      g, claude, role:claude
    scopes: "[groups]"
  secret:
    githubSecret: $argocd-webhook-github:secret
  repositories:
    homelab:
      url: https://github.com/manamana32321/homelab
      name: homelab
      type: git

extraObjects:
  # App of Apps - 다른 Application들을 자동으로 배포
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: apps
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/manamana32321/homelab
        targetRevision: main
        path: k8s/argocd/applications
        directory:
          recurse: true
          exclude: "{argocd.yaml,apps.yaml}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

## Application controller
controller:
  name: application-controller
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus
    # chart 기본 PrometheusRule (commented examples 그대로 사용).
    # 추가 도메인 알림은 homelab-alerts.argocd 그룹에서 관리.
    rules:
      enabled: true
      additionalLabels:
        release: prometheus
      spec:
        - alert: ArgoAppMissing
          expr: |
            absent(argocd_app_info) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "[Argo CD] No reported applications"
            description: >
              Argo CD has not reported any applications data for the past 15 minutes which
              means that it must be down or not functioning properly.  This needs to be
              resolved for this cloud to continue to maintain state.
        - alert: ArgoAppNotSynced
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "[{{`{{$labels.name}}`}}] Application not synchronized"
            description: >
              The application [{{`{{$labels.name}}`}} has not been synchronized for over
              12 hours which means that the state of this cloud has drifted away from the
              state inside Git.

## Dex (로그인은 Authentik OIDC로 직접)
dex:
  enabled: false

## Server
server:
  name: server
  replicas: 1

  service:
    type: ClusterIP

  ## Server metrics service configuration
  metrics:
    # -- Deploy metrics service
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

  # Argo CD server ingress configuration
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
    ingressClassName: traefik
    hostname: argocd.json-server.win
    tls: true
    certificateName: argocd-server-tls
    servicePort: 80

  extraArgs:
    - --insecure

## Repo Server
repoServer:
  name: repo-server
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

## ApplicationSet controller
applicationSet:
  name: applicationset-controller
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

## Notifications controller (disabled - enable when GitHub App is configured)
notifications:
  enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

