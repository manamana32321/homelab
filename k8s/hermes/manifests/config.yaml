# Hermes Agent seed config — copied to /opt/data/config.yaml by the seed
# initContainer only when the live file lacks the openai-codex provider.
# After first boot Hermes owns the live file on the PVC.
# To change live settings, use the dashboard or `hermes config` in the pod.
model:
  # OpenAI Codex via ChatGPT subscription OAuth (billing: subscription_included,
  # no metered/overage). Credential lives in /opt/data/auth.json (seeded), not env.
  provider: openai-codex
  default: gpt-5.6-sol
terminal:
  # local = agent shell runs INSIDE this pod (the pod is the sandbox).
  # docker backend would need docker-in-docker → avoided in K8s.
  backend: local
  timeout: 180
memory:
  memory_enabled: true
  user_profile_enabled: true
