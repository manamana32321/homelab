apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-config
  namespace: hermes
data:
  config.toml: |
    port = "8080"
    toolsets = ["core"]

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: hermes
  labels:
    app.kubernetes.io/name: kubernetes-mcp
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
        app.kubernetes.io/part-of: hermes
    spec:
      serviceAccountName: kubernetes-mcp
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubernetes-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.0.67
          args: ["--config", "/etc/kubernetes-mcp-server/config.toml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: hermes
  labels:
    app.kubernetes.io/name: kubernetes-mcp
spec:
  selector:
    app.kubernetes.io/name: kubernetes-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
