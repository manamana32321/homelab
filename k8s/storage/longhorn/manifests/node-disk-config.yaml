# Longhorn Node 디스크 설정
# Phase 6에서 apply: kubectl apply -f node-disk-config.yaml
#
# server1 SSD: 100GB 할당 (/var/lib/longhorn)
# server2 SSD: 100GB 할당 (/var/lib/longhorn)
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: json-server-1
  namespace: longhorn-system
spec:
  name: json-server-1
  allowScheduling: true
  disks:
    default-disk:
      allowScheduling: true
      evictionRequested: false
      path: /var/lib/longhorn
      storageReserved: 110000000000  # ~110GB 예약
      tags: []
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: json-server-2
  namespace: longhorn-system
spec:
  name: json-server-2
  allowScheduling: true
  disks:
    default-disk:
      allowScheduling: true
      evictionRequested: false
      path: /var/lib/longhorn
      storageReserved: 45000000000   # ~45GB 예약
      tags: []
