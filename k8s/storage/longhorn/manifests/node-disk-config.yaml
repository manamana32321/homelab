# Longhorn Node 디스크 설정
# Phase 6에서 apply: kubectl apply -f node-disk-config.yaml
#
# server1 SSD: 100GB 할당 (/var/lib/longhorn)
# server2 SSD: 100GB 할당 (/var/lib/longhorn)
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: json-server-1
  namespace: longhorn-system
spec:
  name: json-server-1
  allowScheduling: true
  # instance-manager CPU request (millicpu). 전역 기본 12%(8 core → 960m) 대신 노드별 지정.
  # Longhorn 공식: (노드 engine+replica 수) × 0.1 core → 2026-11 기준 6개 → 600m.
  # server-2는 instance 32개라 공식상 더 필요 → 전역 기본(12% = 720m) 유지.
  # 변경은 이 노드 instance-manager에 실행 중인 instance가 없을 때(drain/재부팅) 반영됨.
  instanceManagerCPURequest: 600
  disks:
    default-disk:
      allowScheduling: true
      evictionRequested: false
      path: /var/lib/longhorn
      storageReserved: 110000000000  # ~110GB 예약
      tags: []
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: json-server-2
  namespace: longhorn-system
spec:
  name: json-server-2
  allowScheduling: true
  disks:
    default-disk:
      allowScheduling: true
      evictionRequested: false
      path: /var/lib/longhorn
      storageReserved: 45000000000   # ~45GB 예약
      tags: []
