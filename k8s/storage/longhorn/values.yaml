defaultSettings:
  # 노드별 디스크 할당량은 manifests/node-disk-config.yaml 에서 결정
  defaultDataPath: /var/lib/longhorn
  replicaAutoBalance: best-effort
  # 복제본 1 — 스토리지 노드가 server1+server2 2개뿐이라 replica 2는 rebuild 헤드룸이 없다.
  # (rebuild 는 replica 수 + 1 개의 노드를 필요로 한다)
  # 한쪽이 스케줄 불가가 되면 복제본 2개가 같은 노드에 쌓여, 디스크만 2배 쓰고 HA 는 사라진다.
  # 내구성은 각 워크로드의 S3 백업 CronJob 이 담당한다.
  defaultReplicaCount: 1
  # 스토리지 예약 (각 노드 OS/K8s용)
  storageReservedPercentageForDefaultDisk: 0
  # raspi-1은 Longhorn 스토리지에서 제외
  taintToleration: ""
  # 고아 복제본 자동 삭제 — rebuild 시 남는 잔여 디렉토리 누적 방지 (chart default: false)
  orphanAutoDeletion: true

# 차트 기본 longhorn SC를 default에서 내림 — longhorn-ssd(manifests/storage-class.yaml)만 단독 default 유지
persistence:
  defaultClass: false

# ingress는 argocd auth proxy 뒤에 두거나 비활성화
longhornUI:
  replicas: 1

ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.json-server.win
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
  tls: true
  tlsSecret: longhorn-tls

# raspi-1을 Longhorn 스토리지 노드에서 제외
longhornManager:
  tolerations: []
  nodeSelector: {}

longhornDriver:
  tolerations: []
  nodeSelector: {}
