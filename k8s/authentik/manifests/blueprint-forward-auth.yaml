apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-forward-auth
  namespace: authentik
data:
  forward-auth.yaml: |
    version: 1
    metadata:
      name: "Forward Auth Providers"
    entries:
      # Longhorn
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: longhorn-provider
        attrs:
          name: longhorn-provider
          mode: forward_single
          external_host: https://longhorn.json-server.win
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          slug: longhorn
          meta_launch_url: https://longhorn.json-server.win
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, longhorn-provider]]
          policy_engine_mode: any

      # Longhorn: authentik Admins 그룹만 접근 허용
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, longhorn]]
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          enabled: true
          order: 0
          timeout: 30
          failure_result: false
          negate: false

      - model: authentik_core.application
        state: absent
        identifiers:
          slug: health-hub
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: health-hub-provider

      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: lifehub-provider
        attrs:
          name: lifehub-provider
          mode: forward_single
          external_host: https://life.json-server.win
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: lifehub
        attrs:
          name: lifehub
          slug: lifehub
          meta_launch_url: https://life.json-server.win
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, lifehub-provider]]
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, lifehub]]
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          enabled: true
          order: 0
          timeout: 30
          failure_result: false
          negate: false

      # Hermes
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: hermes-provider
        attrs:
          name: hermes-provider
          mode: forward_single
          external_host: https://hermes.json-server.win
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: hermes
        attrs:
          name: Hermes
          slug: hermes
          meta_launch_url: https://hermes.json-server.win
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, hermes-provider]]
          policy_engine_mode: any

      # Hermes: authentik Admins 그룹만 접근 허용
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 0
          target: !Find [authentik_core.application, [slug, hermes]]
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs:
          enabled: true
          order: 0
          timeout: 30
          failure_result: false
          negate: false

      # Embedded Outpost (모든 forward auth provider를 포함)
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: "authentik Embedded Outpost"
        attrs:
          name: "authentik Embedded Outpost"
          type: proxy
          config:
            authentik_host: https://auth.json-server.win
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, longhorn-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, lifehub-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, hermes-provider]]

      - model: authentik_core.application
        state: absent
        identifiers:
          slug: loop
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: windmill
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: loop-provider
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: windmill-provider

      # CloudBeaver 제거 (2026-11): Authentik 안의 객체 삭제. 다음 정리 때 이 블록째 지워도 됨
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: cloudbeaver
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: cloudbeaver-provider
      - model: authentik_policies_expression.expressionpolicy
        state: absent
        identifiers:
          name: cloudbeaver-require-skku-amang-org
