global:
  envFrom:
    - secretRef:
        name: authentik-secret

server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
    hosts:
      - auth.json-server.win
    paths:
      - /
    tls:
      - secretName: authentik-tls
        hosts:
          - auth.json-server.win
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

worker:
  replicas: 1
  nodeSelector:
    kubernetes.io/arch: amd64
  startupProbe:
    exec:
      command:
        - ak
        - healthcheck
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  # 평소 working set ~950-990Mi (2026-11 기준 7일). 1Gi limit에선 여유 5%라
  # 같은 컨테이너에 `ak shell` 하나만 더 떠도 OOMKilled → request를 실사용에 맞추고
  # limit에 여유를 둠.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi

postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secret
    secretKeys:
      adminPasswordKey: PG_ADMIN_PASSWORD
      userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
  primary:
    nodeSelector:
      kubernetes.io/arch: amd64
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn-ssd
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

blueprints:
  configMaps:
    - blueprint-argocd
    - blueprint-forward-auth
    - blueprint-github-source
    - blueprint-kargo
    - blueprint-lifehub-mcp
    - blueprint-sessions
    - blueprint-users
